# Netlify builds the shareable static prototype: client-side only, hash style links.
# Install runs automatically (pnpm, from the lockfile) before this command.
# On Netlify, Nuxt writes the static files to dist (Nitro picks its Netlify preset); locally, dist is a link to .output/public.
[build]
  command = "AMS_STATIC_DEMO=1 ./node_modules/.bin/nuxt generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
