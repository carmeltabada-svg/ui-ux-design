<style>
  html { background: #f9fafb; }
  html.dark { background: #0f172a; }
  .ams-boot { min-height: 100vh; font-family: Inter, sans-serif; }
  .ams-boot-shell { display: flex; min-height: 100vh; }
  .ams-boot-side { display: none; width: 240px; min-width: 240px; background: #ffffff; border-right: 1px solid #e2e8f0; }
  @media (min-width: 1024px) { .ams-boot-side { display: block; } }
  .ams-boot-main { flex: 1; min-width: 0; }
  .ams-boot-nav { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #ffffff; border-bottom: 1px solid #e2e8f0; }
  .ams-boot-head { background: #ffffff; border-bottom: 1px solid #e2e8f0; }
  .ams-boot-card { display: flex; flex-direction: column; gap: 12px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; }
  .ams-boot-row { height: 56px; border-top: 1px solid #e2e8f0; }
  .ams-boot-kind { display: none; }
  .ams-boot[data-kind="list"] .ams-boot-kind[data-kind="list"],
  .ams-boot[data-kind="workspace"] .ams-boot-kind[data-kind="workspace"],
  .ams-boot[data-kind="create"] .ams-boot-kind[data-kind="create"] { display: block; }
  .ams-boot-doc { display: none; min-height: 100vh; justify-content: center; padding: 40px 16px; background: #eeeae3; }
  .ams-boot[data-kind="doc"] .ams-boot-shell { display: none; }
  .ams-boot[data-kind="doc"] .ams-boot-doc { display: flex; }
  .ams-boot-page { width: 816px; max-width: 100%; min-height: 560px; padding: 72px; display: flex; flex-direction: column; gap: 14px; background: #ffffff; box-shadow: 0 20px 25px -5px rgba(0,0,0,.1), 0 8px 10px -6px rgba(0,0,0,.1); }
  .ams-boot-block { display: block; border-radius: 6px; background: linear-gradient(100deg, rgba(226,232,240,.6) 20%, rgba(226,232,240,1) 50%, rgba(226,232,240,.6) 80%); background-size: 200% 100%; animation: ams-boot-shimmer 1.4s ease-in-out infinite; }
  html.dark .ams-boot-side, html.dark .ams-boot-nav, html.dark .ams-boot-head, html.dark .ams-boot-card { background: #1e293b; border-color: #334155; }
  html.dark .ams-boot-row { border-color: #334155; }
  html.dark .ams-boot-block { background: linear-gradient(100deg, rgba(51,65,85,.6) 20%, rgba(51,65,85,1) 50%, rgba(51,65,85,.6) 80%); background-size: 200% 100%; }
  /* The document preview is a page of paper: it stays light, on a light backdrop, in both themes. */
  html.dark .ams-boot-doc { background: #eeeae3; }
  html.dark .ams-boot-page .ams-boot-block { background: linear-gradient(100deg, rgba(226,232,240,.6) 20%, rgba(226,232,240,1) 50%, rgba(226,232,240,.6) 80%); background-size: 200% 100%; }
  @keyframes ams-boot-shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  @media (prefers-reduced-motion: reduce) { .ams-boot-block { animation: none; } }
</style>
<script>
  try {
    // Same rule as the color mode: the saved choice, else the system setting.
    var m = localStorage.getItem('ams:color-mode');
    if (m === 'dark' || ((!m || m === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
    // The layout of the page being opened.
    var p = location.pathname, k = 'list';
    if (p === '/form-preview' || p === '/gate-pass-preview') k = 'doc';
    else if (p === '/ticket-tracker/create') k = 'create';
    else if (p.indexOf('/ticket-tracker/') === 0) k = 'workspace';
    document.getElementById('ams-boot').setAttribute('data-kind', k);
  } catch (e) {}
</script>
